workflows:
  flet-android-build:
    name: Build Alexandra APK
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      vars:
        FLET_PROJECT_DIR: "final"
    triggering:
      events:
        - push
    scripts:
      - name: Set up Python environment
        script: |
          pip install --upgrade pip
          pip install flet flet-cli
      - name: Build APK via Flet
        script: |
          cd final
          flet build apk Alexandra.py
    artifacts:
      - final/build/apk/*.apk
